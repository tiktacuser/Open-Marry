# OpenMarry for Velocity.
# Marriages are stored in data.properties next to this file. Restart the proxy after changing it.

# Heart symbol used in color change messages
heart.symbol=❤

# Heart color of a new marriage (a name from the heart.color.* list below).
# The color is shared: either spouse can change it, and it changes for both
heart.default-color=red

# Available colors: heart.color.<name>=<Minecraft color code>
heart.color.red=&c
heart.color.pink=&d
heart.color.gold=&6
heart.color.yellow=&e
heart.color.green=&a
heart.color.aqua=&b
heart.color.blue=&9
heart.color.purple=&5
heart.color.white=&f
heart.color.gray=&7

# How many seconds a marriage proposal stays valid
proposal.expire-seconds=60

msg.prefix=&d❤ &7
msg.only-players=&cThis command can only be used by players.
msg.usage-marry=&cUsage: &f/marry <player> &7| &f/marry accept &7| &f/marry deny
msg.usage-heartcolor=&cUsage: &f/heartcolor <color>&7. Available: &f{colors}
msg.player-offline=&cPlayer &f{player} &cis not online.
msg.self-marry=&cYou can't marry yourself.
msg.already-married-self=&cYou are already married.
msg.already-married-other=&cPlayer &f{player} &cis already married.
msg.proposal-sent=&7You proposed to &f{player}&7. Waiting for an answer.
msg.proposal-received=&f{player} &7has proposed to you! Type &f/marry accept &7or &f/marry deny &7within {seconds} seconds.
msg.no-proposal=&cYou have no pending proposal, or it has expired.
msg.proposer-offline=&cThe player who proposed to you has left the game.
msg.proposal-denied-self=&7You declined the proposal from &f{player}&7.
msg.proposal-denied-other=&f{player} &cdeclined your proposal.
msg.married=&d❤ Congratulations! You are now married to &f{player}&d!
msg.not-married=&cYou are not married.
msg.divorced-self=&7You are now divorced.
msg.divorced-other=&f{player} &7divorced you.
msg.unknown-color=&cUnknown color. Available: &f{colors}
msg.color-set=&7Your marriage heart color: {color}&l{heart}
msg.color-changed-other=&f{player} &7changed your marriage heart color to {color}&l{heart}
